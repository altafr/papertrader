<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Momentum Autopilot implemented architecture</title>
  <desc id="desc">Architecture diagram of the current codebase. Vercel hosts the Next.js web app. Railway hosts the authenticated API and persistent worker. Shared packages provide domain rules, Alpaca paper adapters, PostgreSQL repositories, configuration and notifications. The worker researches and trades US equities in paper mode through deterministic risk and reconciliation. Direct crypto entries are disabled; crypto support is limited to observation and close-only maintenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081522"/>
      <stop offset="1" stop-color="#0d1e2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173c63"/>
      <stop offset="1" stop-color="#112940"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124b4b"/>
      <stop offset="1" stop-color="#123b43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#62b8f6"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#36c78c"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e8eef5; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a6b8c9; }
      .section { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d8e6f2; letter-spacing: .6px; }
      .box-title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #eef6ff; }
      .box-sub { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b7c8d8; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b7c8d8; }
      .tiny { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9fb3c7; }
      .pill { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dff7ef; }
      .label { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #85d9b4; letter-spacing: .8px; }
      .warn { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffd58a; }
      .danger { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffb2b8; }
      .line { stroke: #62b8f6; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .line-teal { stroke: #36c78c; stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
      .dash { stroke: #e6ad42; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <path d="M0 90H1600 M0 300H1600 M0 520H1600 M0 740H1600 M0 960H1600" stroke="#193248" stroke-width="1" opacity=".45"/>
  <path d="M70 0V1120 M320 0V1120 M570 0V1120 M820 0V1120 M1070 0V1120 M1320 0V1120" stroke="#193248" stroke-width="1" opacity=".25"/>

  <text x="70" y="58" class="title">Momentum Autopilot — implemented architecture</text>
  <text x="70" y="87" class="subtitle">Current deployed boundary: US-equity paper trading. Browser surfaces are read-only; broker authority stays in Railway.</text>
  <rect x="1190" y="31" width="170" height="40" rx="20" fill="#123b53" stroke="#62b8f6" stroke-width="2"/>
  <text x="1275" y="57" text-anchor="middle" class="pill">PAPER MODE</text>
  <rect x="1375" y="31" width="155" height="40" rx="20" fill="#4a2029" stroke="#f16d76" stroke-width="2"/>
  <text x="1452" y="57" text-anchor="middle" class="danger">LIVE DISABLED</text>

  <text x="70" y="130" class="section">1 · OPERATOR SURFACES</text>
  <rect x="70" y="148" width="1460" height="125" rx="16" fill="url(#blue)" stroke="#3b83c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="92" y="170" width="440" height="82" rx="12" fill="#0d253d" stroke="#32658e"/>
  <text x="116" y="201" class="box-title">apps/web · Next.js on Vercel</text>
  <text x="116" y="226" class="box-sub">Dashboard · sign-in · public health · CSV exports</text>
  <text x="116" y="247" class="tiny">app/dashboard · proxy.ts · auth-provider.tsx</text>
  <rect x="558" y="170" width="440" height="82" rx="12" fill="#0d253d" stroke="#32658e"/>
  <text x="582" y="201" class="box-title">Telegram Mini App</text>
  <text x="582" y="226" class="box-sub">Signed, read-only portfolio / alerts / agents / overnight views</text>
  <text x="582" y="247" class="tiny">app/telegram · x-telegram-init-data</text>
  <rect x="1024" y="170" width="482" height="82" rx="12" fill="#102b3d" stroke="#32658e"/>
  <text x="1048" y="201" class="box-title">Operator boundary</text>
  <text x="1048" y="226" class="box-sub">Clerk session for dashboard · Telegram signature for Mini App</text>
  <text x="1048" y="247" class="tiny">No Alpaca credentials · no direct order authority</text>

  <text x="70" y="315" class="section">2 · RAILWAY SERVICES</text>
  <rect x="70" y="335" width="700" height="218" rx="16" fill="url(#blue)" stroke="#3b83c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="373" class="box-title">apps/api · authenticated Node HTTP API</text>
  <text x="98" y="399" class="box-sub">Read models, operations health, market data, performance, audit exports</text>
  <text x="98" y="423" class="tiny">src/index.ts · Clerk auth · /v1/read-model · /v1/operator-overview</text>
  <rect x="98" y="446" width="194" height="78" rx="10" fill="#102b47" stroke="#3a6f9b"/>
  <text x="116" y="474" class="label">AUTH</text>
  <text x="116" y="497" class="small">operator allowlist</text>
  <rect x="310" y="446" width="194" height="78" rx="10" fill="#102b47" stroke="#3a6f9b"/>
  <text x="328" y="474" class="label">READ MODELS</text>
  <text x="328" y="497" class="small">PostgreSQL projections</text>
  <rect x="522" y="446" width="220" height="78" rx="10" fill="#102b47" stroke="#3a6f9b"/>
  <text x="540" y="474" class="label">PAPER BROKER READS</text>
  <text x="540" y="497" class="small">account / assets / bars</text>

  <rect x="800" y="335" width="730" height="218" rx="16" fill="url(#teal)" stroke="#36c78c" stroke-width="2" filter="url(#shadow)"/>
  <text x="828" y="373" class="box-title">apps/worker · persistent Railway worker</text>
  <text x="828" y="399" class="box-sub">The only continuous runtime for schedules, broker writes, reconciliation and supervision</text>
  <text x="828" y="423" class="tiny">src/index.ts · durable scheduler · paper autopilot · health /health</text>
  <rect x="828" y="446" width="196" height="78" rx="10" fill="#103b3c" stroke="#2f8c79"/>
  <text x="846" y="474" class="label">SCHEDULES</text>
  <text x="846" y="497" class="small">pg-boss + retries</text>
  <rect x="1042" y="446" width="208" height="78" rx="10" fill="#103b3c" stroke="#2f8c79"/>
  <text x="1060" y="474" class="label">STOCK RESEARCH</text>
  <text x="1060" y="497" class="small">bounded US universe</text>
  <rect x="1268" y="446" width="234" height="78" rx="10" fill="#103b3c" stroke="#2f8c79"/>
  <text x="1286" y="474" class="label">EXECUTION LOOP</text>
  <text x="1286" y="497" class="small">risk → order → reconcile</text>

  <path d="M300 273V315" class="line"/>
  <path d="M780 273V315" class="line"/>
  <path d="M470 553V603" class="line"/>
  <path d="M1160 553V603" class="line-teal"/>

  <text x="70" y="638" class="section">3 · SHARED PACKAGES — IMPORTED BY API AND/OR WORKER</text>
  <rect x="70" y="660" width="1460" height="172" rx="16" fill="#101e2c" stroke="#496275" stroke-width="2"/>
  <rect x="92" y="684" width="250" height="124" rx="10" fill="#162d42" stroke="#3f6d8d"/>
  <text x="112" y="715" class="box-title">@momentum/domain</text>
  <text x="112" y="741" class="box-sub">strategy · research · intents</text>
  <text x="112" y="763" class="box-sub">paper risk · exits · metrics</text>
  <text x="112" y="789" class="tiny">decimal-safe deterministic rules</text>
  <rect x="365" y="684" width="250" height="124" rx="10" fill="#16353a" stroke="#3f8d83"/>
  <text x="385" y="715" class="box-title">@momentum/alpaca</text>
  <text x="385" y="741" class="box-sub">paper REST / market stream</text>
  <text x="385" y="763" class="box-sub">account · bars · orders</text>
  <text x="385" y="789" class="tiny">server-side credentials only</text>
  <rect x="638" y="684" width="250" height="124" rx="10" fill="#162d42" stroke="#3f6d8d"/>
  <text x="658" y="715" class="box-title">@momentum/db</text>
  <text x="658" y="741" class="box-sub">Drizzle + node-postgres</text>
  <text x="658" y="763" class="box-sub">repositories · migrations</text>
  <text x="658" y="789" class="tiny">append-only audit / read models</text>
  <rect x="911" y="684" width="250" height="124" rx="10" fill="#162d42" stroke="#3f6d8d"/>
  <text x="931" y="715" class="box-title">@momentum/config</text>
  <text x="931" y="741" class="box-sub">paper mode and env gates</text>
  <text x="931" y="763" class="box-sub">kill switch / schedules</text>
  <text x="931" y="789" class="tiny">live mode rejected at startup</text>
  <rect x="1184" y="684" width="322" height="124" rx="10" fill="#16353a" stroke="#3f8d83"/>
  <text x="1204" y="715" class="box-title">@momentum/notifications</text>
  <text x="1204" y="741" class="box-sub">Telegram alert delivery</text>
  <text x="1204" y="763" class="box-sub">dedupe + persisted status</text>
  <text x="1204" y="789" class="tiny">delivery cannot change trade decisions</text>

  <path d="M770 746H638" class="line"/>
  <path d="M800 746H888" class="line-teal"/>
  <path d="M1160 746H1180" class="line-teal"/>

  <text x="70" y="877" class="section">4 · EXTERNAL SYSTEMS AND PERSISTENCE</text>
  <rect x="70" y="899" width="1460" height="126" rx="16" fill="#111d29" stroke="#496275" stroke-width="2"/>
  <rect x="92" y="922" width="340" height="80" rx="10" fill="#243344" stroke="#668099"/>
  <text x="114" y="953" class="box-title">Alpaca Paper Trading</text>
  <text x="114" y="978" class="box-sub">account · positions · US-stock orders · fills</text>
  <rect x="458" y="922" width="300" height="80" rx="10" fill="#243344" stroke="#668099"/>
  <text x="480" y="953" class="box-title">Alpaca Market Data</text>
  <text x="480" y="978" class="box-sub">finalized bars · snapshots · stream</text>
  <rect x="784" y="922" width="300" height="80" rx="10" fill="#243344" stroke="#668099"/>
  <text x="806" y="953" class="box-title">Railway PostgreSQL</text>
  <text x="806" y="978" class="box-sub">state · jobs · orders · audit history</text>
  <rect x="1110" y="922" width="396" height="80" rx="10" fill="#243344" stroke="#668099"/>
  <text x="1132" y="953" class="box-title">Clerk + Telegram Bot API</text>
  <text x="1132" y="978" class="box-sub">identity · operational notifications</text>

  <path d="M960 553V585H270V899" class="line-teal"/>
  <path d="M1270 553V899" class="line-teal"/>
  <path d="M1080 832V899" class="line"/>
  <path d="M330 899V585H470" class="line"/>

  <rect x="70" y="1046" width="980" height="52" rx="12" fill="#173a39" stroke="#36c78c" stroke-width="2"/>
  <text x="95" y="1078" class="warn">TRADE FLOW</text>
  <text x="215" y="1078" class="box-sub">stock research → versioned signal → deterministic risk → idempotent paper order → reconciliation → read model</text>
  <rect x="1070" y="1046" width="460" height="52" rx="12" fill="#3a2920" stroke="#e6ad42" stroke-width="2"/>
  <text x="1095" y="1068" class="warn">CRYPTO</text>
  <text x="1095" y="1087" class="small">direct entries rejected; monitor / close-only maintenance</text>

  <rect x="1070" y="335" width="430" height="88" rx="12" fill="#3a2920" stroke="#e6ad42" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1094" y="365" class="warn">CURRENT SAFETY BOUNDARY</text>
  <text x="1094" y="389" class="small">TRADING_MODE=paper · stock-only runtime gate</text>
  <text x="1094" y="409" class="small">PAPER_AUTOPILOT + kill switch + freshness checks</text>
</svg>
