name: Paper-only verification

on:
  push:
    branches: [main, phase-6-10-operator-health]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-only-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build workspace packages for tests
        run: pnpm --filter './packages/*' build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Check default research readiness
        run: RESEARCH_SCHEDULE_READINESS=true pnpm --filter @momentum/worker research-readiness

      - name: Build
        run: pnpm build

      - name: Audit secret surfaces
        run: pnpm audit:secret-surfaces

      - name: Verify hosted operator authentication boundary
        run: pnpm verify:operator-auth-boundary

      - name: Verify hosted paper runtime
        env:
          PAPERTRADER_WORKER_HEALTH_URL: ${{ vars.PAPERTRADER_WORKER_HEALTH_URL || 'https://worker-production-b362.up.railway.app/health' }}
          PAPERTRADER_API_HEALTH_URL: ${{ vars.PAPERTRADER_API_HEALTH_URL || 'https://api-production-e0a6.up.railway.app/health' }}
          PAPERTRADER_EXPECTED_RELEASE: ${{ vars.PAPERTRADER_EXPECTED_RELEASE || '' }}
        run: pnpm verify:paper-runtime

      - name: Verify hosted operator overview when credentials are configured
        env:
          OPERATOR_API_BASE_URL: ${{ secrets.OPERATOR_API_BASE_URL }}
          OPERATOR_AUTH_TOKEN: ${{ secrets.OPERATOR_AUTH_TOKEN }}
        run: |
          if [ -n "$OPERATOR_AUTH_TOKEN" ]; then
            pnpm verify:operator-overview
          else
            echo "Hosted operator-overview verification skipped; protected secrets are not configured."
          fi
